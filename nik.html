<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Data Keluarga</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b2430;--muted:#6b7686;--line:#e3e8ee;--accent:#0f766e;--accent-soft:#e0f2f1;--btn:#f1f5f9;--btn-h:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--text:#e8edf3;--muted:#93a0b2;--line:#263140;--accent:#2dd4bf;--accent-soft:#143a38;--btn:#222d3a;--btn-h:#2c3a4a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 2px}
.tag{display:inline-block;font-size:.72rem;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;margin-bottom:10px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.val{font-size:.98rem;word-break:break-word;font-variant-numeric:tabular-nums}
.col{flex:1;min-width:0}
button.cp{flex:none;border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:9px;padding:8px 12px;font-size:.82rem;cursor:pointer;min-width:74px;transition:.15s}
button.cp:hover{background:var(--btn-h)}
button.cp.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Data Keluarga</h1>
  <div class="sub">Ketuk tombol <b>Salin</b> untuk menyalin data ke clipboard.</div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const ALAMAT = "RT 03 RW 02 Desa Wanareja Kecamatan Wanareja Kab. Cilacap";
const KK = "3301151807090008";

const keluarga = [
  {tag:"Kepala Keluarga", kapital:"IBNU DIDIK MAHARDI", nama:"Ibnu Didik Mahardi", nik:"3301151301750002", ttl:["Cilacap, 13 Januari 1975","13 Januari 1975","13-01-1975"]},
  {tag:"Istri", kapital:"ARI WIDIASTUTI MARTINA", nama:"Ari Widiastuti Martina", nik:"3301154501820001", ttl:["Banyumas, 05 Januari 1982","05 Januari 1982","05-01-1982"]},
  {tag:"Anak", kapital:"JOSHUA AZKHA RADITYA MAHARDI", nama:"Joshua Azkha Raditya Mahardi", nik:"3301152212070007", nisn:"0078085131", ttl:["Cilacap, 22 Desember 2007","22 Desember 2007","22-12-2007"]},
  {tag:"Anak", kapital:"DYANDRA NAUFAL PRADIPTA MAHARDI", nama:"Dyandra Naufal Pradipta Mahardi", nik:"3301151302130004", nisn:"0134314621", ttl:["Cilacap, 13 Februari 2013","13 Februari 2013","13-02-2013"]},
  {tag:"Anak", kapital:"DEVANO AIZAR RADIKA MAHARDI", nama:"Devano Aizar Radika Mahardi", nik:"3301151310170005", ttl:["Cilacap, 13 Oktober 2017","13 Oktober 2017","13-10-2017"]}
];

const lain = [
  {tag:"KK Terpisah", kapital:"WATIYAH", nama:"Watiyah", kk:"3301150201054536", nik:"3301154101410009"}
];

const kakek = [
  {tag:"Mbah Putri", nama:"RATINAH"},
  {tag:"Mbah Kakung", nama:"ASNGARI"}
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function row(label, value){
  return `<div class="row"><div class="col"><div class="lbl">${esc(label)}</div><div class="val">${esc(value)}</div></div>
  <button class="cp" data-v="${esc(value)}" data-l="${esc(label)}">Salin</button></div>`;
}

function card(title, tag, rows){
  return `<div class="card"><span class="tag">${esc(tag)}</span><h2>${esc(title)}</h2>${rows.join("")}</div>`;
}

let html = "";
html += card("Alamat & Nomor KK", "Keluarga Inti", [row("Alamat", ALAMAT), row("Nomor KK", KK)]);

keluarga.forEach(p=>{
  const r = [row("Nama (kapital)", p.kapital), row("Nama", p.nama), row("NIK", p.nik)];
  if(p.nisn) r.push(row("NISN", p.nisn));
  if(p.ttl){ r.push(row("TTL (tempat, tanggal)", p.ttl[0]), row("Tanggal Lahir", p.ttl[1]), row("Tanggal Lahir (angka)", p.ttl[2])); }
  html += card(p.nama, p.tag, r);
});

lain.forEach(p=>{
  html += card(p.nama, p.tag, [row("Nama (kapital)", p.kapital), row("Nama", p.nama), row("Nomor KK", p.kk), row("NIK", p.nik)]);
});

kakek.forEach(p=>{
  html += card(p.nama, p.tag, [row("Nama", p.nama)]);
});

document.getElementById("app").innerHTML = html;

const toast = document.getElementById("toast");
let tt;
function showToast(m){
  toast.textContent = m; toast.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>toast.classList.remove("show"), 1600);
}

async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; }
  }catch(e){}
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}

document.addEventListener("click", async e=>{
  const b = e.target.closest("button.cp");
  if(!b) return;
  const ok = await copyText(b.dataset.v);
  if(ok){
    b.classList.add("ok"); const old = b.textContent; b.textContent = "Tersalin ✓";
    setTimeout(()=>{ b.classList.remove("ok"); b.textContent = old; }, 1300);
    showToast(b.dataset.l + " disalin");
  } else showToast("Gagal menyalin, salin manual");
});
</script>
</body>
</html>
