<html lang="id">

<meta charset="UTF-8">

<title>Toolkit Outreach — 14 Niche TeraWeb</title>
<style>

  :root{
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #1D1E1B;
    --ink-soft: rgba(29,30,27,0.64);
    --accent: #3D4FE0;
    --accent-dim: #2C3AB0;
    --success: #2FA84F;
    --line: rgba(29,30,27,0.12);
    --tab-w: 260px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Inter', sans-serif; line-height:1.55; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ font-family: inherit; cursor:pointer; }
  input, textarea{ font-family: inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition-duration:0.001ms !important; } }

  /* ===== APP SHELL ===== */
  .app{ display:flex; min-height:100vh; max-width:1200px; margin:0 auto; }

  /* ===== SIDEBAR (index tabs) ===== */
  .sidebar{ width: var(--tab-w); flex-shrink:0; border-right:1px solid var(--line); padding: 24px 0; }
  .sidebar-head{ padding: 0 20px 18px; border-bottom:1px solid var(--line); margin-bottom: 10px; }
  .sidebar-head h1{ font-size:1.05rem; font-weight:700; }
  .sidebar-head p{ font-size:0.78rem; color: var(--ink-soft); margin-top:4px; }
  .sidebar-me{ padding: 16px 20px; border-bottom:1px solid var(--line); margin-bottom: 4px; }
  .sidebar-me label{ display:block; font-size:0.74rem; color: var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .sidebar-me input{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:0.86rem;
    background: var(--paper); color: var(--ink);
  }
  .sidebar-me input:focus{ background:#fff; }

  .mobile-me{ display:none; padding: 14px 20px; border-bottom:1px solid var(--line); }
  .mobile-me label{ display:block; font-size:0.76rem; color: var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .mobile-me input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.88rem;
    background: var(--card); color: var(--ink);
  }
  .tab-list{ list-style:none; max-height: calc(100vh - 200px); overflow-y:auto; }
  .tab-item{ position:relative; }
  .tab-btn{
    width:100%; text-align:left; background:none; border:none; padding: 12px 20px 12px 24px;
    font-size:0.86rem; color: var(--ink-soft); border-left: 3px solid transparent;
  }
  .tab-btn:hover{ background: rgba(61,79,224,0.05); color: var(--ink); }
  .tab-btn.active{ background: rgba(61,79,224,0.08); color: var(--accent); border-left-color: var(--accent); font-weight:600; }
  .tab-num{ font-family:'JetBrains Mono', monospace; font-size:0.7rem; opacity:0.6; margin-right:8px; }

  /* Mobile select */
  .mobile-select{ display:none; }

  /* ===== MAIN ===== */
  main{ flex:1; padding: 32px 36px 80px; min-width:0; }
  .niche-title{ font-size:1.5rem; font-weight:700; margin-bottom: 4px; }
  .niche-sub{ font-size:0.86rem; color: var(--ink-soft); margin-bottom: 28px; }

  /* Keywords */
  .block{ margin-bottom: 34px; }
  .block-label{ font-family:'JetBrains Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-soft); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
  .kw-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .kw-chip{
    background: var(--card); border:1px solid var(--line); border-radius:20px; padding: 7px 14px;
    font-size:0.82rem; display:flex; align-items:center; gap:8px;
  }
  .kw-copy{ background:none; border:none; color: var(--accent); font-size:0.78rem; font-weight:600; padding:0; }

  /* Editable fields */
  .fields{ background: var(--card); border:1px solid var(--line); border-radius:12px; padding: 20px 22px; display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
  @media (max-width: 720px){ .fields{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:0.76rem; color: var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .field input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px; font-size:0.88rem;
    background: var(--paper); color: var(--ink);
  }
  .field input:focus{ background:#fff; }
  .field-link-stack{ display:flex; flex-direction:column; gap:12px; }

  .hint{ font-size:0.78rem; color: var(--ink-soft); margin-top:10px; }

  /* Message cards */
  .msg-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 860px){ .msg-grid{ grid-template-columns:1fr; } }
  .msg-card{ background: var(--card); border:1px solid var(--line); border-radius:12px; padding: 20px 20px 18px; display:flex; flex-direction:column; }
  .msg-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .msg-label{ font-size:0.86rem; font-weight:700; }
  .copy-btn{
    background: var(--accent); color:#fff; border:none; border-radius:6px; padding:7px 14px;
    font-size:0.78rem; font-weight:600; transition: background 0.15s;
  }
  .copy-btn:hover{ background: var(--accent-dim); }
  .copy-btn.copied{ background: var(--success); }
  .msg-preview{
    display:block; width:100%; box-sizing:border-box; font-family:inherit;
    white-space:pre-wrap; font-size:0.86rem; color: var(--ink); background: var(--paper);
    border:1px solid var(--line); border-radius:8px; padding: 14px; min-height:150px;
    resize:vertical; overflow-y:hidden;
  }
  .msg-preview:focus{ outline:none; border-color: var(--accent); background:#fff; }
  .msg-preview .ph{ background: rgba(61,79,224,0.15); border-radius:3px; padding:0 2px; }
  .msg-head-actions{ display:flex; align-items:center; gap:10px; }
  .reset-btn{
    background:none; border:none; color: var(--ink-soft); font-size:0.76rem; font-weight:500;
    padding:0; text-decoration:underline;
  }
  .reset-btn:hover{ color: var(--accent); }

  footer{ padding: 26px 36px; text-align:center; font-size:0.78rem; color: var(--ink-soft); border-top:1px solid var(--line); }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ display:none; }
    .mobile-select{ display:block; padding: 18px 20px 0; }
    .mobile-select select{
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.9rem;
      background: var(--card);
    }
    .mobile-me{ display:block; }
    main{ padding: 0 20px 60px; }
  }

  .fields{ grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); }
  .demo-row{ display:flex; gap:8px; align-items:center; }
  .demo-row input{ flex:1; min-width:0; }
  .open-btn{ background:none; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:0.78rem; font-weight:600; color:var(--accent); text-decoration:none; white-space:nowrap; }
  .open-btn:hover{ background:rgba(61,79,224,0.06); }
  .group-head{ grid-column:1/-1; font-family:'JetBrains Mono',monospace; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-top:14px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .group-head:first-child{ margin-top:0; }
  .note{ background:#FFF6E0; border:1px solid #F0DDA8; border-radius:8px; padding:10px 14px; font-size:0.82rem; margin-bottom:22px; }
</style>

let currentId = DATA[0].id;
const state = {};
let pengirim = 'Didik';
try{ pengirim = localStorage.getItem('tw_pengirim') || 'Didik'; }catch(e){}
DATA.forEach(n => { state[n.id] = { panggil:'[Nama]', nama:'[nama usaha]', kota:'[kota]', daerah:'[daerah]', link:n.link, link2:n.link2||'' }; });
const tabList = document.getElementById('tabList');
const mobileSelect = document.getElementById('mobileSelect');
const content = document.getElementById('content');
const esc = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

DATA.forEach((n,i) => {
  const li = document.createElement('li'); li.className = 'tab-item';
  const b = document.createElement('button');
  b.className = 'tab-btn' + (n.id===currentId ? ' active' : ''); b.dataset.id = n.id;
  b.innerHTML = `<span class="tab-num mono">${String(i+1).padStart(2,'0')}</span>${n.name}`;
  b.addEventListener('click', () => selectNiche(n.id));
  li.appendChild(b); tabList.appendChild(li);
  const o = document.createElement('option'); o.value = n.id; o.textContent = n.name; mobileSelect.appendChild(o);
});
mobileSelect.addEventListener('change', e => selectNiche(e.target.value));

function fill(t, s){
  const links=[s.link,s.link2].map(x=>(x||'').trim()).filter(Boolean);
  if(links.length>1) t=t.replace(/(:|😊|🙏) \{\{link\}\}/g,'$1\n{{link}}');
  if(links.length>1) t=t.replaceAll('Ini contoh tampilannya','Ini '+links.length+' contoh tampilannya');
  return t.replaceAll('{{pengirim}}', pengirim||'[nama pengirim]').replaceAll('{{panggil}}', s.panggil||'[Nama]').replaceAll('{{nama}}', s.nama||'[nama usaha]').replaceAll('{{kota}}', s.kota||'[kota]')
          .replaceAll('{{daerah}}', s.daerah||'[daerah]').replaceAll('{{link}}', links.join('\n')||'[link demo]');
}
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+3)+'px'; }
function selectNiche(id){
  currentId = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.id===id));
  mobileSelect.value = id; render();
}
function copyText(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent='Disalin ✓'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent=o; btn.classList.remove('copied'); },1600); };
  const fb = () => { const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} document.body.removeChild(ta); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fb); } else fb();
}
function render(){
  const n = DATA.find(x => x.id===currentId), s = state[n.id];
  const usesDaerah = JSON.stringify(n).includes('{{daerah}}');
  content.innerHTML = `
    <div class="niche-title">${n.name}</div>
    <div class="niche-sub">Demo, keyword pencarian &amp; draft pesan outreach &middot; sapaan: ${n.sap}</div>
    ${n.note ? `<div class="note">${esc(n.note)}</div>` : ''}
    <div class="block">
      <div class="block-label"><span>Isian</span></div>
      <div class="fields">
        <div class="field"><label for="fPanggil">Nama calon klien (nama panggilan)</label><input type="text" id="fPanggil" value="${esc(s.panggil)}"></div>
        <div class="field"><label for="fNama">Nama usaha target</label><input type="text" id="fNama" value="${esc(s.nama)}"></div>
        <div class="field"><label for="fKota">Kota</label><input type="text" id="fKota" value="${esc(s.kota)}"></div>
        ${usesDaerah ? `<div class="field"><label for="fDaerah">Daerah (untuk "dekat ...")</label><input type="text" id="fDaerah" value="${esc(s.daerah)}"></div>` : ''}
        <div class="field" style="grid-column:1/-1"><label for="fLink">Link demo</label>
          <div class="demo-row"><input type="text" id="fLink" value="${esc(s.link)}"><button class="copy-btn" id="copyLink">Copy link</button><a class="open-btn" id="openLink" href="${esc(s.link)}" target="_blank" rel="noopener">Buka demo ↗</a></div></div>
        <div class="field" style="grid-column:1/-1"><label for="fLink2">Link demo 2 (opsional)</label>
          <div class="demo-row"><input type="text" id="fLink2" value="${esc(s.link2)}"><a class="open-btn" id="openLink2" href="${esc(s.link2)}" target="_blank" rel="noopener">Buka demo ↗</a></div></div>
      </div>
    </div>
    <div class="block">
      <div class="block-label"><span>Keyword Pencarian</span><button class="kw-copy" id="copyAllKw">Copy semua</button></div>
      <div class="kw-list" id="kwList"></div>
    </div>
    <div class="hint">Placeholder lain dalam kurung siku (misal hal spesifik yang dipuji) diedit langsung di kotak pesan.</div>
    <div class="msg-grid" id="msgGrid"></div>`;
  const kwList = document.getElementById('kwList');
  const kws = () => n.keywords.map(k => fill(k, state[n.id]));
  const drawKw = () => { kwList.innerHTML=''; kws().forEach(k => {
    const c=document.createElement('div'); c.className='kw-chip'; c.innerHTML=`<span class="mono">${esc(k)}</span>`;
    const b=document.createElement('button'); b.className='kw-copy'; b.textContent='Copy'; b.addEventListener('click',()=>copyText(k,b));
    c.appendChild(b); kwList.appendChild(c); }); };
  drawKw();
  document.getElementById('copyAllKw').addEventListener('click', e => copyText(kws().join('\n'), e.target));
  const grid = document.getElementById('msgGrid');
  let lastGroup='';
  n.variants.forEach(v => {
    if(v.group!==lastGroup){ lastGroup=v.group; const h=document.createElement('div'); h.className='group-head'; h.textContent=v.group; grid.appendChild(h); }
    const card = document.createElement('div'); card.className='msg-card';
    card.innerHTML = `<div class="msg-head"><div class="msg-label">${v.label}</div><div class="msg-head-actions"><button class="reset-btn">Reset ke template</button><button class="copy-btn">Copy Pesan</button></div></div><textarea class="msg-preview"></textarea>`;
    const ta = card.querySelector('.msg-preview'); let dirty=false;
    const upd = () => { if(!dirty) ta.value = fill(v.template, state[n.id]); autoGrow(ta); };
    ta.addEventListener('input', () => { dirty=true; autoGrow(ta); });
    card.querySelector('.reset-btn').addEventListener('click', () => { dirty=false; upd(); });
    card.querySelector('.copy-btn').addEventListener('click', e => copyText(ta.value, e.target));
    grid.appendChild(card); upd(); card._update = upd;
  });
  const ids = {panggil:'fPanggil', nama:'fNama', kota:'fKota', daerah:'fDaerah', link:'fLink', link2:'fLink2'};
  Object.entries(ids).filter(([k,id]) => document.getElementById(id)).forEach(([k,id]) => document.getElementById(id).addEventListener('input', e => {
    state[n.id][k] = e.target.value;
    if(k==='link') document.getElementById('openLink').href = e.target.value.trim() || '#';
    if(k==='link2') document.getElementById('openLink2').href = e.target.value.trim() || '#';
    drawKw(); document.querySelectorAll('.msg-card').forEach(c => c._update());
  }));
  document.getElementById('copyLink').addEventListener('click', e => copyText(state[n.id].link, e.target));
}
render();
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>document.querySelectorAll('.msg-preview').forEach(autoGrow)); }

const fPeng = document.getElementById('fPengirim'), fPengM = document.getElementById('fPengirimMobile');
fPeng.value = fPengM.value = pengirim;
function onPengirim(v){
  pengirim = v; fPeng.value = v; fPengM.value = v;
  try{ localStorage.setItem('tw_pengirim', v); }catch(e){}
  document.querySelectorAll('.msg-card').forEach(c => c._update && c._update());
}
fPeng.addEventListener('input', e => onPengirim(e.target.value));
fPengM.addEventListener('input', e => onPengirim(e.target.value));

</script>
</body>
</html>
