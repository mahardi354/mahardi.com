<html lang="id">

<meta charset="UTF-8">

<title>Toolkit Outreach — 49 Niche TeraWeb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --ink: #1D1E1B;
    --ink-soft: rgba(29,30,27,0.64);
    --accent: #3D4FE0;
    --accent-dim: #2C3AB0;
    --success: #2FA84F;
    --line: rgba(29,30,27,0.12);
    --tab-w: 260px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Inter', sans-serif; line-height:1.55; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ font-family: inherit; cursor:pointer; }
  input, textarea{ font-family: inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition-duration:0.001ms !important; } }

  /* ===== APP SHELL ===== */
  .app{ display:flex; min-height:100vh; max-width:1200px; margin:0 auto; }

  /* ===== SIDEBAR (index tabs) ===== */
  .sidebar{ width: var(--tab-w); flex-shrink:0; border-right:1px solid var(--line); padding: 24px 0; }
  .sidebar-head{ padding: 0 20px 18px; border-bottom:1px solid var(--line); margin-bottom: 10px; }
  .sidebar-head h1{ font-size:1.05rem; font-weight:700; }
  .sidebar-head p{ font-size:0.78rem; color: var(--ink-soft); margin-top:4px; }
  .sidebar-me{ padding: 16px 20px; border-bottom:1px solid var(--line); margin-bottom: 4px; }
  .sidebar-me label{ display:block; font-size:0.74rem; color: var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .sidebar-me input{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:0.86rem;
    background: var(--paper); color: var(--ink);
  }
  .sidebar-me input:focus{ background:#fff; }

  .mobile-me{ display:none; padding: 14px 20px; border-bottom:1px solid var(--line); }
  .mobile-me label{ display:block; font-size:0.76rem; color: var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .mobile-me input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.88rem;
    background: var(--card); color: var(--ink);
  }
  .tab-list{ list-style:none; max-height: calc(100vh - 200px); overflow-y:auto; }
  .tab-item{ position:relative; }
  .tab-btn{
    width:100%; text-align:left; background:none; border:none; padding: 12px 20px 12px 24px;
    font-size:0.86rem; color: var(--ink-soft); border-left: 3px solid transparent;
  }
  .tab-btn:hover{ background: rgba(61,79,224,0.05); color: var(--ink); }
  .tab-btn.active{ background: rgba(61,79,224,0.08); color: var(--accent); border-left-color: var(--accent); font-weight:600; }
  .tab-num{ font-family:'JetBrains Mono', monospace; font-size:0.7rem; opacity:0.6; margin-right:8px; }

  /* Mobile select */
  .mobile-select{ display:none; }

  /* ===== MAIN ===== */
  main{ flex:1; padding: 32px 36px 80px; min-width:0; }
  .niche-title{ font-size:1.5rem; font-weight:700; margin-bottom: 4px; }
  .niche-sub{ font-size:0.86rem; color: var(--ink-soft); margin-bottom: 28px; }

  /* Keywords */
  .block{ margin-bottom: 34px; }
  .block-label{ font-family:'JetBrains Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-soft); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
  .kw-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .kw-chip{
    background: var(--card); border:1px solid var(--line); border-radius:20px; padding: 7px 14px;
    font-size:0.82rem; display:flex; align-items:center; gap:8px;
  }
  .kw-copy{ background:none; border:none; color: var(--accent); font-size:0.78rem; font-weight:600; padding:0; }

  /* Editable fields */
  .fields{ background: var(--card); border:1px solid var(--line); border-radius:12px; padding: 20px 22px; display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
  @media (max-width: 720px){ .fields{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:0.76rem; color: var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .field input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px; font-size:0.88rem;
    background: var(--paper); color: var(--ink);
  }
  .field input:focus{ background:#fff; }
  .field-link-stack{ display:flex; flex-direction:column; gap:12px; }

  .hint{ font-size:0.78rem; color: var(--ink-soft); margin-top:10px; }

  /* Message cards */
  .msg-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 860px){ .msg-grid{ grid-template-columns:1fr; } }
  .msg-card{ background: var(--card); border:1px solid var(--line); border-radius:12px; padding: 20px 20px 18px; display:flex; flex-direction:column; }
  .msg-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .msg-label{ font-size:0.86rem; font-weight:700; }
  .copy-btn{
    background: var(--accent); color:#fff; border:none; border-radius:6px; padding:7px 14px;
    font-size:0.78rem; font-weight:600; transition: background 0.15s;
  }
  .copy-btn:hover{ background: var(--accent-dim); }
  .copy-btn.copied{ background: var(--success); }
  .msg-preview{
    display:block; width:100%; box-sizing:border-box; font-family:inherit;
    white-space:pre-wrap; font-size:0.86rem; color: var(--ink); background: var(--paper);
    border:1px solid var(--line); border-radius:8px; padding: 14px; min-height:150px;
    resize:vertical; overflow-y:hidden;
  }
  .msg-preview:focus{ outline:none; border-color: var(--accent); background:#fff; }
  .msg-preview .ph{ background: rgba(61,79,224,0.15); border-radius:3px; padding:0 2px; }
  .msg-head-actions{ display:flex; align-items:center; gap:10px; }
  .reset-btn{
    background:none; border:none; color: var(--ink-soft); font-size:0.76rem; font-weight:500;
    padding:0; text-decoration:underline;
  }
  .reset-btn:hover{ color: var(--accent); }

  footer{ padding: 26px 36px; text-align:center; font-size:0.78rem; color: var(--ink-soft); border-top:1px solid var(--line); }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ display:none; }
    .mobile-select{ display:block; padding: 18px 20px 0; }
    .mobile-select select{
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.9rem;
      background: var(--card);
    }
    .mobile-me{ display:block; }
    main{ padding: 0 20px 60px; }
  }
</style>

        "template": "Halo Kak {{nama}}, perkenalkan saya {{namaKamu}} dari TeraWeb.\n\nSaya sempat lihat profil kost atau rumah kontrakan Kakak di {{sumber}}, dan coba buatkan mockup desain website khusus kost atau rumah kontrakan biar tampilannya makin profesional dan terpercaya di mata calon pelanggan.\n\n{{intro}}\n{{links}}\n\n{{tanya}} saya bisa langsung sesuaikan pakai nama & info usaha {{sap}} sendiri, umumnya tayang dalam 3 sampai 5 hari kerja. Harganya jelas dan sekali bayar: website 4 halaman Rp750.000, tanpa biaya perpanjangan tahunan ke TeraWeb 🙂"
      }
    ]
  },
  {
    "id": "game-center-rental-ps-pc",
    "name": "Game center / rental PS & PC",
    "defaults": {
      "sumber": "Instagram",
      "link1": "",
      "link2": ""
    },
    "keywords": [
      "game center [kota]",
      "rental PS [kota]",
      "warnet [kota]",
      "#gamecenter[kota]",
      "#rentalps[kota]",
      "#warnet[kota]"
    ],
    "variants": [
      {
        "label": "Observasi Spesifik",
        "template": "Halo Kak {{nama}},\n\nSaya baru saja lihat profil game center atau rental PS dan PC Kakak di {{sumber}}. Tempatnya keliatan seru dan nyaman... tapi sayang kalau beberapa cabang Kakak belum ada tempat yang nunjukin semuanya sekaligus kak..\n\nSaya sudah bikin contoh desain website khusus untuk niche game center atau rental PS dan PC, boleh saya kirim linknya kalau Kakak penasaran? Kalau cocok, umumnya website bisa tayang dalam 3 sampai 5 hari kerja.\n\nTerima kasih Kak 🙏"
      },
      {
        "label": "Demo Duluan",
        "template": "Halo Kak {{nama}}, perkenalkan saya {{namaKamu}} dari TeraWeb.\n\nSaya sempat lihat profil game center atau rental PS dan PC Kakak di {{sumber}}, dan coba buatkan mockup desain website khusus game center atau rental PS dan PC biar tampilannya makin profesional dan terpercaya di mata calon pelanggan.\n\n{{intro}}\n{{links}}\n\n{{tanya}} saya bisa langsung sesuaikan pakai nama & info usaha {{sap}} sendiri, umumnya tayang dalam 3 sampai 5 hari kerja. Harganya jelas dan sekali bayar: website 4 halaman Rp750.000, tanpa biaya perpanjangan tahunan ke TeraWeb 🙂"
      }
    ]
  }
];

let currentId = DATA[0].id;
let fieldState = {}; // per niche id -> {nama, sumber, link}
let globalState = { namaKamu: "" }; // berlaku untuk semua niche

DATA.forEach(n => {
  fieldState[n.id] = { nama: "[Nama]", sumber: n.defaults.sumber, link1: n.defaults.link1, link2: n.defaults.link2 };
});

const tabList = document.getElementById('tabList');
const mobileSelect = document.getElementById('mobileSelect');
const content = document.getElementById('content');

DATA.forEach((n, i) => {
  const li = document.createElement('li');
  li.className = 'tab-item';
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (n.id === currentId ? ' active' : '');
  btn.dataset.id = n.id;
  btn.innerHTML = `<span class="tab-num mono">${String(i+1).padStart(2,'0')}</span>${n.name}`;
  btn.addEventListener('click', () => selectNiche(n.id));
  li.appendChild(btn);
  tabList.appendChild(li);

  const opt = document.createElement('option');
  opt.value = n.id;
  opt.textContent = n.name;
  mobileSelect.appendChild(opt);
});

mobileSelect.addEventListener('change', (e) => selectNiche(e.target.value));

const fNamaKamu = document.getElementById('fNamaKamu');
const fNamaKamuMobile = document.getElementById('fNamaKamuMobile');

function onNamaKamuInput(value){
  globalState.namaKamu = value;
  fNamaKamu.value = value;
  fNamaKamuMobile.value = value;
  document.querySelectorAll('.msg-card').forEach(c => c._update && c._update());
}

fNamaKamu.addEventListener('input', (e) => onNamaKamuInput(e.target.value));
fNamaKamuMobile.addEventListener('input', (e) => onNamaKamuInput(e.target.value));

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 3) + 'px';
}

function fill(template, state){
  const sap = template.includes('Bapak/Ibu') ? 'Bapak/Ibu' : 'Kakak';
  const links = [state.link1, state.link2].map(x => (x || '').trim()).filter(Boolean);
  const intro = links.length > 1 ? 'Ini 2 contoh gayanya:' : 'Ini contohnya:';
  const linkText = links.length ? links.join('\n') : '[link demo]';
  const tanya = links.length > 1
    ? 'Kira-kira ' + sap + ' lebih suka yang mana? Kalau ada yang cocok,'
    : 'Kira-kira cocok, ' + sap + '? Kalau cocok,';
  return template
    .replaceAll('{{intro}}', intro)
    .replaceAll('{{links}}', linkText)
    .replaceAll('{{tanya}}', tanya)
    .replaceAll('{{sap}}', sap)
    .replaceAll('{{nama}}', state.nama || '[Nama]')
    .replaceAll('{{sumber}}', state.sumber || '')
    .replaceAll('{{namaKamu}}', globalState.namaKamu || '[Nama Kamu]');
}

function selectNiche(id){
  currentId = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  mobileSelect.value = id;
  render();
}

function copyText(text, btn){
  const done = () => {
    const original = btn.textContent;
    btn.textContent = 'Disalin ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}

function render(){
  const n = DATA.find(x => x.id === currentId);
  const state = fieldState[n.id];

  content.innerHTML = `
    <div class="niche-title">${n.name}</div>
    <div class="niche-sub">Keyword pencarian &amp; draft pesan outreach</div>

    <div class="block">
      <div class="block-label">
        <span>Keyword Pencarian</span>
        <button class="kw-copy" id="copyAllKw">Copy semua</button>
      </div>
      <div class="kw-list" id="kwList"></div>
    </div>

    <div class="block">
      <div class="block-label">Isian (berlaku untuk kedua pesan di bawah)</div>
      <div class="fields">
        <div class="field">
          <label for="fNama">Nama calon klien</label>
          <input type="text" id="fNama" value="${state.nama}">
        </div>
        <div class="field">
          <label for="fSumber">Sumber/platform observasi</label>
          <input type="text" id="fSumber" value="${state.sumber}">
        </div>
        <div class="field field-link-stack">
          <div>
            <label for="fLink1">Link demo 1</label>
            <input type="text" id="fLink1" value="${state.link1}">
          </div>
          <div>
            <label for="fLink2">Link demo 2 (opsional)</label>
            <input type="text" id="fLink2" value="${state.link2}">
          </div>
        </div>
      </div>
    </div>

    <div class="hint">Daftar demo lengkap: <span class="mono">teraweb.id/demo/</span> (website 4 halaman) dan <span class="mono">teraweb.id/demolanding/</span> (landing page). Isi hanya Link demo 1 kalau mau kirim satu contoh; pesan menyesuaikan otomatis.</div>
    <div class="msg-grid" id="msgGrid"></div>
  `;

  const kwList = document.getElementById('kwList');
  n.keywords.forEach(k => {
    const chip = document.createElement('div');
    chip.className = 'kw-chip';
    chip.innerHTML = `<span class="mono">${k}</span>`;
    const b = document.createElement('button');
    b.className = 'kw-copy';
    b.textContent = 'Copy';
    b.addEventListener('click', () => copyText(k, b));
    chip.appendChild(b);
    kwList.appendChild(chip);
  });

  document.getElementById('copyAllKw').addEventListener('click', (e) => {
    copyText(n.keywords.join('\n'), e.target);
  });

  const msgGrid = document.getElementById('msgGrid');
  n.variants.forEach(v => {
    const card = document.createElement('div');
    card.className = 'msg-card';
    card.innerHTML = `
      <div class="msg-head">
        <div class="msg-label">${v.label}</div>
        <div class="msg-head-actions">
          <button class="reset-btn">Reset ke template</button>
          <button class="copy-btn">Copy Pesan</button>
        </div>
      </div>
      <textarea class="msg-preview"></textarea>
    `;
    const preview = card.querySelector('.msg-preview');
    const btn = card.querySelector('.copy-btn');
    const resetBtn = card.querySelector('.reset-btn');
    let dirty = false;
    const updatePreview = () => { if(!dirty){ preview.value = fill(v.template, fieldState[n.id]); } autoGrow(preview); };
    preview.addEventListener('input', () => { dirty = true; autoGrow(preview); });
    resetBtn.addEventListener('click', () => { dirty = false; updatePreview(); });
    btn.addEventListener('click', () => copyText(preview.value, btn));
    msgGrid.appendChild(card);
    updatePreview();
    card._update = updatePreview;
  });

  const fNama = document.getElementById('fNama');
  const fSumber = document.getElementById('fSumber');
  const fLink1 = document.getElementById('fLink1');
  const fLink2 = document.getElementById('fLink2');

  const onInput = () => {
    fieldState[n.id] = { nama: fNama.value, sumber: fSumber.value, link1: fLink1.value, link2: fLink2.value };
    document.querySelectorAll('.msg-card').forEach(c => c._update());
  };
  fNama.addEventListener('input', onInput);
  fSumber.addEventListener('input', onInput);
  fLink1.addEventListener('input', onInput);
  fLink2.addEventListener('input', onInput);
}

render();

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    document.querySelectorAll('.msg-preview').forEach(autoGrow);
  });
}
</script>

</body>
</html>
